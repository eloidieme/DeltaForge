[package]
name = "deltaforge"
version = "0.1.0"
edition = "2024"
default-run = "deltaforge"
description = "A local CodeCrafters-style learning framework for staged systems-programming projects."
license = "MIT"
repository = "https://github.com/eloidieme/DeltaForge"
readme = "README.md"
keywords = ["learning", "education", "cli", "systems-programming", "tutorial"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
exclude = [
    "/.github",
    "/docs",
    "/handoffs",
    "/tests",
    "/tools",
    "/Spec.md",
    "/target",
]

[dependencies]
anyhow = "1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.8"

[dev-dependencies]
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
