[package]
name = "deltaforge"
version = "1.0.0"
edition = "2024"
default-run = "deltaforge"
description = "Build a real developer tool on your own machine, one behavior at a time."
license = "MIT"
repository = "https://github.com/eloidieme/DeltaForge"
readme = "README.md"
keywords = ["learning", "education", "cli", "systems-programming", "tutorial"]
categories = ["command-line-utilities", "development-tools"]
# Let-chains (`if x && let Some(y) = z`) are used throughout and stabilised in
# 1.88. 1.85 was the edition-2024 floor and was never the real minimum: the
# crate has never compiled on it. The MSRV job in CI checks this now, which is
# how the claim was found to be false.
rust-version = "1.88"
exclude = [
    "/.github",
    "/docs",
    "/tests",
    "/tools",
    "/target",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.3"
hostname = "0.4"
include_dir = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
# 0.3.47 fixes RUSTSEC-2026-0009 (stack exhaustion parsing RFC 2822). The
# previous `=0.3.45` pin existed because 0.3.46 raised `time`'s MSRV above the
# Rust 1.85 this crate claimed — a claim that was never true, so the pin was
# holding a security fix out for a reason that did not exist.
time = { version = "0.3.47", features = ["formatting", "parsing"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
