schema_version: 1
id: flashindex
name: FlashIndex
version: 2.0.0
description: Local source-code search engine
topics:
  - indexing
  - data structures
  - cli
  - performance
languages:
  rust:
    template: templates/rust
    build:
      command: ["cargo", "build", "--release"]
    run:
      command: ["cargo", "run", "--release", "--"]
    bench_run:
      command: ["./target/release/flashindex"]
ignored_paths:
  - .git
  - target
  - build
  - node_modules
stages:
  - id: 01_scan_files
    title: Scan files
    path: stages/01_scan_files
  - id: 02_filter_files
    title: Choose searchable files
    path: stages/02_filter_files
  - id: 03_tokenize
    title: Recognize tokens
    path: stages/03_tokenize
  - id: 04_exact_search
    title: Find an exact token
    path: stages/04_exact_search
  - id: 05_inverted_index
    title: Group files by token
    path: stages/05_inverted_index
  - id: 06_canonical_index
    title: Make the index canonical
    path: stages/06_canonical_index
  - id: 07_persist_index
    title: Write the index to disk
    path: stages/07_persist_index
  - id: 08_query_index
    title: Query a saved index
    path: stages/08_query_index
  - id: 09_benchmark_mode
    title: Describe a scan as data
    path: stages/09_benchmark_mode
  - id: 10_report_summary
    title: Summarize the corpus
    path: stages/10_report_summary
  - id: 11_parallel_indexing
    title: Build the index with several workers
    path: stages/11_parallel_indexing
  - id: 12_parallel_performance
    title: Measure parallel speedup
    path: stages/12_parallel_performance
  - id: 13_ranked_search
    title: Score multi-token matches
    path: stages/13_ranked_search
  - id: 14_stable_ranking
    title: Make ranking stable
    path: stages/14_stable_ranking
