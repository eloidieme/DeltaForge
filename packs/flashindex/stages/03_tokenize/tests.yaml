tests:
  - name: tokenizes simple Rust identifiers
    diagnosis:
      priority: 10
      headline: Basic identifiers are not recognized as tokens
      contract: Recognize the longest runs that begin with an ASCII letter or _ and continue through ASCII letters, digits, or _.
    fixture: simple_tokens
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_contains:
        - "src/main.rs:1:1 fn"
        - "src/main.rs:1:4 main"
        - "src/main.rs:2:9 fetch_or"
        - "src/main.rs:2:20 value_32"

  - name: ignores punctuation while preserving underscores
    diagnosis:
      priority: 30
      headline: Punctuation characters appear in the token stream
      contract: Punctuation separates tokens and is never emitted.
    fixture: punctuation_project
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_contains:
        - "src/flags.cpp:1:5 main"
        - "src/flags.cpp:2:8 uint32_t"
        - "src/flags.cpp:3:10 memory_order_relaxed"
      stdout_not_contains:
        - "::"
        - ";"
        - "("

  - name: tokenizes nested source files in stable relative paths
    diagnosis:
      priority: 20
      headline: Tokenization stops before nested source files
      contract: Nested files and occurrences retain stable path and source order.
    fixture: nested_sources
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_contains:
        - "src/lib.rs:1:5 alpha"
        - "src/nested/mod.rs:1:5 beta_token"

  - name: skips leading digits and preserves actual columns
    diagnosis:
      priority: 42
      headline: A token's column does not point to its first byte
      contract: In 123abc, only abc is emitted, at the column where a appears.
    fixture: edge_tokens
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_exact: |
        src/digits.rs:1:4 alpha
        src/digits.rs:1:11 _beta2

  - name: empty source file produces no occurrences
    diagnosis:
      priority: 60
      headline: An empty source file produces spurious output
      contract: An empty source file produces no occurrences.
    fixture: empty_source
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_exact: ""

  - name: last token is emitted without a trailing newline
    diagnosis:
      priority: 24
      headline: The last token in a file goes unreported
      contract: Every identifier-like token in a file must be recognized, including the final token when the file has no trailing newline.
    fixture: no_trailing_newline
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_exact: |
        src/tail.rs:1:1 alpha
        src/tail.rs:1:7 beta

  - name: columns count bytes and lone underscore is a token
    diagnosis:
      priority: 26
      headline: Byte columns and lone underscore tokens are mishandled
      contract: Columns count bytes rather than displayed glyphs, and a lone _ still begins a valid token.
    fixture: byte_columns
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_exact: |
        src/unicode.rs:1:1 let
        src/unicode.rs:1:7 _x
        src/unicode.rs:2:1 _

  - name: carriage return line endings keep one based positions
    diagnosis:
      priority: 55
      headline: Windows line endings shift reported line numbers
      contract: Use one-based line and byte-column positions for every recognized token.
    fixture: crlf_lines
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_contains:
        - "src/win.rs:1:1 alpha"
        - "src/win.rs:2:1 beta"
        - "src/win.rs:2:6 gamma"

  - name: files are processed in sorted portable path order
    diagnosis:
      priority: 40
      headline: Multiple files are tokenized out of sorted order
      contract: Process files in sorted portable-path order, then print occurrences in their source order within each file.
    fixture: two_files_order
    command: ["tokenize", "{fixture_path}"]
    expect:
      exit_code: 0
      stdout_exact: |
        src/a.rs:1:1 one
        src/b.rs:1:1 two
