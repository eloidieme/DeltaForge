tests:
  - name: one thread preserves canonical output
    diagnosis:
      priority: 10
      headline: Single-threaded output no longer matches the canonical index
      contract: Keep the threaded index command and byte-identical output for every thread count.
    fixture: parallel_project
    command: ["index", "{fixture_path}", "--threads", "1"]
    expect:
      exit_code: 0
      stdout_exact: |
        Gamma lib/core.rs
        alpha src/a.rs src/b.rs
        beta src/a.rs src/b.rs
        delta src/b.rs
        fn lib/core.rs src/a.rs src/b.rs
        gamma lib/core.rs src/a.rs
        let src/a.rs src/b.rs
        struct lib/core.rs

  - name: eight threads preserve canonical output
    diagnosis:
      priority: 24
      headline: Eight-thread runs diverge from the canonical index
      contract: All measured thread counts produce the same canonical bytes.
    fixture: parallel_project
    command: ["index", "{fixture_path}", "--threads", "8"]
    expect:
      exit_code: 0
      stdout_exact: |
        Gamma lib/core.rs
        alpha src/a.rs src/b.rs
        beta src/a.rs src/b.rs
        delta src/b.rs
        fn lib/core.rs src/a.rs src/b.rs
        gamma lib/core.rs src/a.rs
        let src/a.rs src/b.rs
        struct lib/core.rs

