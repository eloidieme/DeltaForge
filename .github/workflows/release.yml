name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish-crate:
    name: Publish crate
    needs: [build]
    # Only for a tag that names exactly the version in Cargo.toml.
    #
    # `cargo publish` publishes the version in the manifest, not the version in
    # the tag. Without this guard, pushing `v1.0.0-rc.1` — the release
    # candidate whose entire purpose is to be validated *before* 1.0.0 exists —
    # would publish crate version 1.0.0 to crates.io, permanently, on the way
    # to finding out whether it worked. A crates.io publish cannot be deleted,
    # only yanked.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Decide whether this tag publishes the crate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" = "$manifest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME matches Cargo.toml $manifest; publishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Crate not published::Tag $GITHUB_REF_NAME does not name Cargo.toml version $manifest. Binaries and a GitHub Release are still produced."
          fi

      - name: Publish to crates.io
        if: steps.gate.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Compute version string
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Package archive (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="deltaforge-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/deltaforge" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          ARCHIVE="${STAGE}.tar.gz"
          tar -czf "$ARCHIVE" "$STAGE"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          echo "ARCHIVE_NAME=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "deltaforge-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/deltaforge.exe" -Destination $stage
          Copy-Item README.md,LICENSE -Destination $stage
          $archive = "$stage.zip"
          Compress-Archive -Path $stage -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE_NAME=$archive"

      - name: Attest release archive provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - uses: actions/upload-artifact@v4
        with:
          name: deltaforge-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, publish-crate]
    # `publish-crate` skips its publish step for a release candidate, so this
    # must not require a *successful* publish — only that nothing failed.
    if: |
      startsWith(github.ref, 'refs/tags/')
      && needs.build.result == 'success'
      && needs.publish-crate.result != 'failure' 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract this version's changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A candidate carries the notes of the version it is a candidate for:
          # `v1.0.0-rc.1` reads the `## 1.0.0` section. The CHANGELOG has no
          # heading for a pre-release and should not grow one — the notes do not
          # differ, only the confidence does.
          release_version="${version%%-*}"
          extract() {
            awk -v heading="## $1" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
              END { if (!found) exit 1 }
            ' CHANGELOG.md
          }
          if [ "$version" != "$release_version" ]; then
            {
              echo "**Release candidate for ${release_version}.** Not published to"
              echo "crates.io; install from the archives below to validate it."
              echo
              extract "$release_version"
            } > release-notes.md
          else
            extract "$version" > release-notes.md
          fi
          test -s release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          # Anything with a hyphen after the version is a pre-release:
          # v1.0.0-rc.1 is, v1.0.0 is not.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
          body_path: release-notes.md
