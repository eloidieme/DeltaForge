name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check --release
      - run: cargo clippy --release --all-targets -- -D warnings
      - name: Run cargo test
        timeout-minutes: 15
        shell: bash
        run: |
          set +e
          cargo test 2>&1 | tee cargo-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [ "$test_status" -ne 0 ]; then
            details=$(grep -E 'test .* \.\.\. FAILED|panicked at|assertion .* failed|left:|right:|expected stdout|[0-9]+ passed, [0-9]+ failed|timed out|another DeltaForge|error:' cargo-test.log | tail -n 20 | tr '\r\n' '  ')
            if [ -z "$details" ]; then
              details="cargo test failed; inspect the job log"
            fi
            echo "::error title=Rust test failure::$details"
            exit "$test_status"
          fi
      - run: cargo run -- validate-pack --strict

  page:
    # The workbench page is the entire product surface, and until now nothing
    # in CI executed a line of it: `tests/browser_journey.rs` sends the
    # requests the page is supposed to send, which is not the same thing. This
    # job runs the page itself.
    name: Workbench page (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fast, and enough on its own to have caught the 1.0 creation bug.
      - name: Unit-test the page's pure decisions
        run: node --test "tests/ui/**/*.test.js"

      - name: Check interface colour contrast
        run: python3 tools/a11y/contrast_check.py

      - uses: dtolnay/rust-toolchain@stable
      - name: Build deltaforge
        run: cargo build --locked

      - name: Install Playwright
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A workspace and a DeltaForge home that have never existed, which is the
      # state of a new learner's machine and the state no harness reproduced.
      - name: Drive the whole journey in a headless browser
        timeout-minutes: 20
        run: node tests/browser/journey.mjs

  msrv:
    name: Minimum Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check the documented minimum Rust version
        # The published crate's MSRV covers its library and binaries. The MCP
        # protocol client used only by integration tests currently requires a
        # newer compiler through its process-wrapper development dependency.
        run: cargo check --locked --lib --bins

  publish-dry-run:
    name: Crates.io package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify the exact crate payload
        run: cargo publish --dry-run --locked

  energy:
    # P1-4. A release build with a browser tab open burned 7% of one core
    # while the learner was reading, which is what surfaces in macOS energy
    # reporting as a misbehaving background app. The watcher was rewritten;
    # this is what stops it regressing.
    name: Idle CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Assert the idle service stays under 1% of a core
        run: python3 tools/perf/idle_cpu.py

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
