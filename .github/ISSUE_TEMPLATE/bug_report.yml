name: Bug report
description: Report a reproducible DeltaForge defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. For security issues, use the private reporting link instead.
  - type: input
    id: version
    attributes:
      label: DeltaForge version
      placeholder: Output of deltaforge --version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Start from a clean, known state and include the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include exact error text, with private paths or learner code removed.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive information
      options:
        - label: I removed credentials, capability tokens, private paths, and learner source code.
          required: true
